<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="riderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#riderGrad)" />
  <circle cx="256" cy="256" r="180" fill="#ffffff" fill-opacity="0.08" />
  <g filter="url(#shadow)" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Back wheel -->
    <circle cx="160" cy="350" r="48" fill="#0369A1" stroke="#FFFFFF" stroke-width="20" />
    <!-- Front wheel -->
    <circle cx="360" cy="350" r="48" fill="#0369A1" stroke="#FFFFFF" stroke-width="20" />
    <!-- Scooter frame -->
    <path d="M160 350 L230 350 L270 270 L340 270 L360 350" stroke="#FFFFFF" stroke-width="24" />
    <!-- Handlebar & stem -->
    <path d="M330 230 L350 270" stroke-width="26" stroke="#FFFFFF" />
    <path d="M305 230 L355 230" stroke-width="24" stroke="#38BDF8" />
    <!-- Rider Delivery Box / Parcel on Back -->
    <rect x="135" y="210" width="75" height="75" rx="14" fill="#38BDF8" stroke="#FFFFFF" stroke-width="12" />
    <line x1="172" y1="210" x2="172" y2="285" stroke="#FFFFFF" stroke-width="8" />
    <line x1="135" y1="247" x2="210" y2="247" stroke="#FFFFFF" stroke-width="8" />
    <!-- Speed Lines -->
    <line x1="75" y1="230" x2="115" y2="230" stroke="#38BDF8" stroke-width="12" />
    <line x1="55" y1="265" x2="110" y2="265" stroke="#FFFFFF" stroke-width="12" />
    <line x1="85" y1="300" x2="120" y2="300" stroke="#38BDF8" stroke-width="12" />
  </g>
</svg>
